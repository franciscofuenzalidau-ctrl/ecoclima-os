<!doctype html>
<!--
  lang="es": el panel está en español. Estaba declarado como "en" (valor por defecto de
  la plantilla de Vite) y Chrome ofrecía traducirlo. Al traducirlo leía "14 ago" —agosto
  abreviado— como el inglés "14 ago" y lo reescribía a "hace 14 años" en el calendario.
  translate="no" evita además que lo traduzca aunque el usuario lo pida por error.
-->
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Instalable en el telefono: con esto el navegador ofrece "Agregar a pantalla de inicio"
         y la app abre a pantalla completa, sin barra de direcciones. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060b13" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Furtz Clima" />
    <title>Furtz Clima OS · Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
